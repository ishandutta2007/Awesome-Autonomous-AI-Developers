<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f3f4f6" />
      <stop offset="70%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <style>
      .glow-pulse {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-particle {
        animation: float 6s ease-in-out infinite alternate;
      }
      .circuit-dash {
        stroke-dasharray: 8 6;
        animation: dash 12s linear infinite;
      }
      .orbit-spin {
        transform-origin: 1050px 180px;
        animation: spin 20s linear infinite;
      }
      .orbit-spin-reverse {
        transform-origin: 1050px 180px;
        animation: spin-rev 15s linear infinite;
      }
      @keyframes pulse {
        0% { opacity: 0.35; transform: scale(0.98); }
        100% { opacity: 0.75; transform: scale(1.02); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-15px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -140; }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-rev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Ambient Background Glows (stay in background behind text) -->
  <g class="glow-pulse" style="transform-origin: 200px 180px;">
    <circle cx="160" cy="90" r="140" fill="#6366f1" opacity="0.22" filter="blur(60px)"/>
    <circle cx="600" cy="280" r="160" fill="#06b6d4" opacity="0.16" filter="blur(70px)"/>
  </g>
  <g class="glow-pulse" style="transform-origin: 1050px 180px;">
    <circle cx="1020" cy="160" r="180" fill="#8b5cf6" opacity="0.25" filter="blur(65px)"/>
  </g>

  <!-- Background Animated Tech Circuit Lines (non-obstructive) -->
  <g opacity="0.35" class="circuit-dash">
    <path d="M 0 100 L 250 100 L 320 50 L 500 50" fill="none" stroke="#6366f1" stroke-width="1.5"/>
    <path d="M 1200 260 L 980 260 L 920 310 L 700 310" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <path d="M 50 320 L 180 320 L 240 280 L 450 280" fill="none" stroke="#8b5cf6" stroke-width="1.2"/>
  </g>

  <!-- Side Tech Orb Graphic (Dynamic / Animated on right side, leaves center & left clear for text) -->
  <g opacity="0.85">
    <circle cx="1050" cy="180" r="90" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="1050" cy="180" r="60" fill="none" stroke="#475569" stroke-dasharray="4 4" stroke-width="1.5"/>
    <circle cx="1050" cy="180" r="28" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
    
    <!-- Rotating Orbits with Particles -->
    <g class="orbit-spin">
      <circle cx="1140" cy="180" r="6" fill="#38bdf8"/>
      <circle cx="960" cy="180" r="4" fill="#818cf8"/>
    </g>
    <g class="orbit-spin-reverse">
      <circle cx="1050" cy="240" r="5" fill="#a855f7"/>
      <circle cx="1050" cy="120" r="3.5" fill="#34d399"/>
    </g>
    <!-- Code symbol in orb core -->
    <text x="1050" y="186" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#38bdf8">&lt;/&gt;</text>
  </g>

  <!-- Floating Ambient Particles (far right and top, outside text area) -->
  <g class="float-particle">
    <circle cx="880" cy="80" r="3" fill="#a5b4fc" opacity="0.6"/>
    <circle cx="920" cy="290" r="4" fill="#38bdf8" opacity="0.5"/>
    <circle cx="280" cy="40" r="2.5" fill="#c084fc" opacity="0.5"/>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed high contrast, fully readable, crisp -->
  <!-- Top Category Tag Pill -->
  <g transform="translate(80, 48)">
    <rect width="320" height="32" rx="16" fill="url(#pill-grad)" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="4" fill="#34d399">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe" letter-spacing="1.2">CURATED ECOSYSTEM &amp; RADAR</text>
  </g>

  <!-- Main Hero Title (Crisp foreground) -->
  <text x="80" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#text-grad)" letter-spacing="-0.5">
    Awesome Autonomous AI Developers
  </text>

  <!-- Subtitle Line 1 -->
  <text x="80" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" letter-spacing="0.2">
    The Definitive Guide to Autonomous Coding Agents, Multi-Agent SWE &amp; AI-Native IDEs
  </text>

  <!-- Subtitle Line 2 / Meta -->
  <text x="80" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
    Open-Source Agent Harnesses • SWE-bench Verified • Commercial SaaS Platforms • Terminal Copilots
  </text>

  <!-- Foreground Feature Badges / Capability Highlights -->
  <g transform="translate(80, 252)">
    <!-- Pill 1: Full-Stack SWE -->
    <rect x="0" y="0" width="170" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2"/>
    <text x="85" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ Autonomous SWE</text>

    <!-- Pill 2: Multi-Agent -->
    <rect x="185" y="0" width="180" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2"/>
    <text x="275" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c084fc">🤖 Multi-Agent Teams</text>

    <!-- Pill 3: Terminal Agents -->
    <rect x="380" y="0" width="180" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2"/>
    <text x="470" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399">💻 Terminal &amp; Headless</text>

    <!-- Pill 4: Open Benchmarks -->
    <rect x="575" y="0" width="170" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2"/>
    <text x="660" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fbbf24">🎯 SWE-bench Verified</text>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="354" width="1200" height="6" rx="3" fill="url(#primary-glow)"/>
</svg>
